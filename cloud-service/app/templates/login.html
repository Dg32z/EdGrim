<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>登录 · WatchNeko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/admin/assets/md3.css">
</head>
<body>

<div class="login">
    <form class="login__card" id="login-form" novalidate>
        <h1 class="login__title">WatchNeko 控制台</h1>
        <p class="card__hint">管理员登录。租户 API key 不能用于此处。</p>

        <label class="field">
            <input id="login-username" name="username" type="text" placeholder=" "
                   autocomplete="username" required autofocus>
            <span class="field__label">用户名</span>
        </label>

        <label class="field">
            <input id="login-password" name="password" type="password" placeholder=" "
                   autocomplete="current-password" required>
            <span class="field__label">密码</span>
        </label>

        <p class="login__error" id="login-error" role="alert"></p>

        <button class="btn btn--filled" type="submit" id="login-submit">登录</button>
    </form>
</div>

<div id="overlay-root"></div>

<script type="module" src="/admin/assets/page-login.js"></script>
</body>
</html>
