services:
  cloud:
    build: ./cloud-service
    ports:
      - "8000:8000"
    environment:
      # A JSON array of tenants. Empty means "development posture": every caller is one local tenant,
      # which is fine on localhost and wrong the moment this port is reachable from elsewhere.
      WATCHNEKO_TENANTS: '[]'
      WATCHNEKO_QUOTA_PER_MINUTE: "6000"
      WATCHNEKO_RETENTION_DAYS: "90"
      WATCHNEKO_RETRAIN_INTERVAL_SECONDS: "3600"
      WATCHNEKO_DATABASE_PATH: "/data/watchneko.db"
      # 控制台。不设密码则整个 /admin 不挂载——没有管理员密码时不该有一个能登录的界面。
      WATCHNEKO_ADMIN_USERNAME: "admin"
      WATCHNEKO_ADMIN_PASSWORD: "change-me-before-exposing-this-port"
      # 固定它，否则每次重启都会让所有管理会话失效。
      WATCHNEKO_ADMIN_SECRET: "change-me-too"
      WATCHNEKO_TRAINER: "logistic"
    volumes:
      - watchneko-data:/data
    restart: unless-stopped

volumes:
  watchneko-data:
