services:
  cloud:
    build: ./cloud-service
    ports:
      - "8000:8000"
    volumes:
      # 一个卷装下配置与数据库：首次启动会在这里生成 config.yaml，
      # 里面带着随机的管理员密码与会话密钥。
      - watchneko-data:/data
    command: ["python", "run.py", "--config", "/data/config.yaml"]
    restart: unless-stopped

volumes:
  watchneko-data:
